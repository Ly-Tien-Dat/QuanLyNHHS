# ============================================
# CẤU HÌNH ỨNG DỤNG - QUẢN LÝ NHÀ HÀNG HẢI SẢN
# ============================================
spring.application.name=QuanLyNHHS

# ============================================
# CẤU HÌNH ORACLE DATABASE
# ============================================
# Thay đổi thông tin kết nối phù hợp với Oracle DB của bạn
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.username=QuanLyNHHS
spring.datasource.password=123456
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ============================================
# CẤU HÌNH JPA / HIBERNATE
# ============================================
# Sử dụng Oracle Dialect
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# update: tự động cập nhật schema (dev), validate: kiểm tra schema (production)
spring.jpa.hibernate.ddl-auto=update

# Hiển thị SQL query trong console (để debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# CẤU HÌNH THYMELEAF
# ============================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# ============================================
# CẤU HÌNH SERVER
# ============================================
server.port=8080

# ============================================
# TẠM THỜI BỎ QUA KẾT NỐI DB (bỏ comment nếu chưa có Oracle)
# ============================================
