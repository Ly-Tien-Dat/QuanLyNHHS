<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${nhaCungCap.maNcc != null ? 'Cập Nhật Nhà Cung Cấp' : 'Thêm Mới Nhà Cung Cấp'}">Form Nhà Cung Cấp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-water"></i> Quản Lý Nhà Hàng Hải Sản</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link active fw-semibold" th:href="@{/nha-cung-cap}"><i class="bi bi-truck"></i> Nhà Cung Cấp</a>
                <a class="nav-link text-white" th:href="@{/nguyen-lieu}"><i class="bi bi-box-seam"></i> Kho & Nguyên Liệu</a>
                <a class="nav-link text-white" th:href="@{/phieu-nhap}"><i class="bi bi-receipt"></i> Phiếu Nhập</a>
            </div>
        </div>
    </nav>

    <div class="container" style="max-width: 700px;">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3 border-bottom">
                <h4 class="card-title mb-0 fw-bold text-primary">
                    <i th:class="${nhaCungCap.maNcc != null ? 'bi bi-pencil-square' : 'bi bi-plus-circle'}"></i>
                    <span th:text="${nhaCungCap.maNcc != null ? 'Cập Nhật Thông Tin Nhà Cung Cấp' : 'Thêm Mới Nhà Cung Cấp'}"></span>
                </h4>
            </div>
            <div class="card-body p-4">
                <form th:action="${nhaCungCap.maNcc != null ? '/nha-cung-cap/sua/' + nhaCungCap.maNcc : '/nha-cung-cap/them'}" 
                      th:object="${nhaCungCap}" 
                      method="post">
                    
                    <div class="mb-3">
                        <label for="tenNcc" class="form-label fw-semibold">Tên Nhà Cung Cấp <span class="text-danger">*</span></label>
                        <input type="text" id="tenNcc" th:field="*{tenNcc}" class="form-control" placeholder="Ví dụ: Hải Sản Tươi Sống Vũng Tàu" required>
                    </div>

                    <div class="mb-3">
                        <label for="diaChi" class="form-label fw-semibold">Địa Chỉ</label>
                        <input type="text" id="diaChi" th:field="*{diaChi}" class="form-control" placeholder="Ví dụ: 123 Thùy Vân, Vũng Tàu">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="sdt" class="form-label fw-semibold">Số Điện Thoại</label>
                            <input type="tel" id="sdt" th:field="*{sdt}" class="form-control" placeholder="Ví dụ: 0901234567">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label fw-semibold">Email</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="Ví dụ: contact@haisan.com">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a th:href="@{/nha-cung-cap}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle me-1"></i> Hủy
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save me-1"></i> Lưu Thông Tin
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
