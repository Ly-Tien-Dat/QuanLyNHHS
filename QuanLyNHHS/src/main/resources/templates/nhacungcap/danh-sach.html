<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Nhà Cung Cấp - Nhà Hàng Hải Sản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">
                <i class="bi bi-water"></i> Quản Lý Nhà Hàng Hải Sản
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link active fw-semibold" th:href="@{/nha-cung-cap}"><i class="bi bi-truck"></i> Nhà Cung Cấp</a>
                <a class="nav-link text-white" th:href="@{/nguyen-lieu}"><i class="bi bi-box-seam"></i> Kho & Nguyên Liệu</a>
                <a class="nav-link text-white" th:href="@{/phieu-nhap}"><i class="bi bi-receipt"></i> Phiếu Nhập</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Thông báo flash -->
        <div th:if="${thongBao}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${thongBao}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${loi}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${loi}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Header thẻ card -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-2">
                <div>
                    <h3 class="card-title fw-bold text-primary mb-1"><i class="bi bi-buildings"></i> Danh Sách Nhà Cung Cấp</h3>
                    <p class="text-muted mb-0">Quản lý đối tác cung ứng hải sản và gia vị nhà hàng</p>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{/nha-cung-cap/them}" class="btn btn-success">
                        <i class="bi bi-plus-circle me-1"></i> Thêm Nhà Cung Cấp
                    </a>
                </div>
            </div>
        </div>

        <!-- Thanh tìm kiếm -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body">
                <form th:action="@{/nha-cung-cap/tim-kiem}" method="get" class="row g-2">
                    <div class="col-md-10">
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                            <input type="text" name="tuKhoa" class="form-control" placeholder="Nhập tên nhà cung cấp cần tìm..." th:value="${tuKhoa}">
                        </div>
                    </div>
                    <div class="col-md-2 d-flex gap-2">
                        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search"></i> Tìm</button>
                        <a th:href="@{/nha-cung-cap}" class="btn btn-outline-secondary" title="Đặt lại"><i class="bi bi-arrow-clockwise"></i></a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Bảng danh sách -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle mb-0">
                        <thead class="table-primary text-nowrap">
                            <tr>
                                <th class="text-center" style="width: 70px;">Mã</th>
                                <th>Tên Nhà Cung Cấp</th>
                                <th>Địa Chỉ</th>
                                <th>Số Điện Thoại</th>
                                <th>Email</th>
                                <th class="text-center" style="width: 150px;">Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(danhSachNCC)}">
                                <td colspan="6" class="text-center py-4 text-muted">
                                    <i class="bi bi-inbox fs-3 d-block mb-2"></i> Chưa có dữ liệu nhà cung cấp nào.
                                </td>
                            </tr>
                            <tr th:each="ncc : ${danhSachNCC}">
                                <td class="text-center fw-bold text-secondary" th:text="${ncc.maNcc}"></td>
                                <td class="fw-semibold text-dark" th:text="${ncc.tenNcc}"></td>
                                <td th:text="${ncc.diaChi}"></td>
                                <td>
                                    <span class="badge bg-light text-dark border">
                                        <i class="bi bi-telephone text-primary me-1"></i><span th:text="${ncc.sdt}"></span>
                                    </span>
                                </td>
                                <td>
                                    <span th:if="${ncc.email}" class="text-muted">
                                        <i class="bi bi-envelope me-1"></i><span th:text="${ncc.email}"></span>
                                    </span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{'/nha-cung-cap/sua/' + ${ncc.maNcc}}" class="btn btn-sm btn-outline-warning me-1" title="Sửa">
                                        <i class="bi bi-pencil-square"></i> Sửa
                                    </a>
                                    <a th:href="@{'/nha-cung-cap/xoa/' + ${ncc.maNcc}}" 
                                       class="btn btn-sm btn-outline-danger" 
                                       title="Xóa"
                                       onclick="return confirm('Bạn có chắc chắn muốn xóa nhà cung cấp này?');">
                                        <i class="bi bi-trash"></i> Xóa
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
