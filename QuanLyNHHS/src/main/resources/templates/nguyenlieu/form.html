<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${nguyenLieu.maNl != null ? 'Cập Nhật Nguyên Liệu' : 'Thêm Mới Nguyên Liệu'}">Form Nguyên Liệu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-water"></i> Quản Lý Nhà Hàng Hải Sản</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white" th:href="@{/nha-cung-cap}"><i class="bi bi-truck"></i> Nhà Cung Cấp</a>
                <a class="nav-link active fw-semibold" th:href="@{/nguyen-lieu}"><i class="bi bi-box-seam"></i> Kho & Nguyên Liệu</a>
                <a class="nav-link text-white" th:href="@{/phieu-nhap}"><i class="bi bi-receipt"></i> Phiếu Nhập</a>
            </div>
        </div>
    </nav>

    <div class="container" style="max-width: 700px;">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3 border-bottom">
                <h4 class="card-title mb-0 fw-bold text-primary">
                    <i th:class="${nguyenLieu.maNl != null ? 'bi bi-pencil-square' : 'bi bi-plus-circle'}"></i>
                    <span th:text="${nguyenLieu.maNl != null ? 'Cập Nhật Nguyên Liệu / Hải Sản' : 'Thêm Mới Nguyên Liệu / Hải Sản'}"></span>
                </h4>
            </div>
            <div class="card-body p-4">
                <form th:action="${nguyenLieu.maNl != null ? '/nguyen-lieu/sua/' + nguyenLieu.maNl : '/nguyen-lieu/them'}" 
                      th:object="${nguyenLieu}" 
                      method="post">
                    
                    <div class="mb-3">
                        <label for="tenNl" class="form-label fw-semibold">Tên Nguyên Liệu / Hải Sản <span class="text-danger">*</span></label>
                        <input type="text" id="tenNl" th:field="*{tenNl}" class="form-control" placeholder="Ví dụ: Tôm hùm bông, Cua hoàng đế,..." required>
                    </div>

                    <div class="mb-3">
                        <label for="donViTinh" class="form-label fw-semibold">Đơn Vị Tính <span class="text-danger">*</span></label>
                        <select id="donViTinh" th:field="*{donViTinh}" class="form-select" required>
                            <option value="kg">kg (Kilogram)</option>
                            <option value="con">con</option>
                            <option value="thùng">thùng</option>
                            <option value="hộp">hộp</option>
                            <option value="lít">lít</option>
                            <option value="gói">gói</option>
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="soLuongTon" class="form-label fw-semibold">Số Lượng Tồn Kho</label>
                            <input type="number" step="0.01" id="soLuongTon" th:field="*{soLuongTon}" class="form-control" placeholder="0.0" th:readonly="${nguyenLieu.maNl != null}">
                            <small class="text-muted" th:if="${nguyenLieu.maNl != null}"><i class="bi bi-info-circle"></i> Tồn kho cập nhật tự động khi nhập hàng</small>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="giaNhap" class="form-label fw-semibold">Giá Nhập Ban Đầu / Gần Nhất (VNĐ)</label>
                            <input type="number" step="1000" id="giaNhap" th:field="*{giaNhap}" class="form-control" placeholder="0">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a th:href="@{/nguyen-lieu}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle me-1"></i> Hủy
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save me-1"></i> Lưu Thông Tin
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
