<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Phiếu Nhập Hàng Mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-water"></i> Quản Lý Nhà Hàng Hải Sản</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white" th:href="@{/nha-cung-cap}"><i class="bi bi-truck"></i> Nhà Cung Cấp</a>
                <a class="nav-link text-white" th:href="@{/nguyen-lieu}"><i class="bi bi-box-seam"></i> Kho & Nguyên Liệu</a>
                <a class="nav-link active fw-semibold" th:href="@{/phieu-nhap}"><i class="bi bi-receipt"></i> Phiếu Nhập</a>
            </div>
        </div>
    </nav>

    <div class="container" style="max-width: 700px;">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3 border-bottom">
                <h4 class="card-title mb-0 fw-bold text-primary">
                    <i class="bi bi-plus-circle me-1"></i> Tạo Phiếu Nhập Hàng Mới
                </h4>
            </div>
            <div class="card-body p-4">
                <form th:action="@{/phieu-nhap/them}" method="post">
                    
                    <div class="mb-3">
                        <label for="maNcc" class="form-label fw-semibold">Chọn Nhà Cung Cấp <span class="text-danger">*</span></label>
                        <select id="maNcc" name="maNcc" class="form-select" required>
                            <option value="">-- Chọn đối tác cung ứng --</option>
                            <option th:each="ncc : ${danhSachNCC}" 
                                    th:value="${ncc.maNcc}" 
                                    th:text="${ncc.tenNcc} + ' (' + ${ncc.diaChi != null ? ncc.diaChi : 'Chưa có địa chỉ'} + ')'">
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="ngayNhap" class="form-label fw-semibold">Ngày Nhập Hàng</label>
                        <input type="date" id="ngayNhap" name="ngayNhap" class="form-control" th:value="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}">
                    </div>

                    <div class="mb-3">
                        <label for="ghiChu" class="form-label fw-semibold">Ghi Chú</label>
                        <textarea id="ghiChu" name="ghiChu" class="form-control" rows="3" placeholder="Ghi chú về lô hàng, chất lượng hải sản sống, phương tiện vận chuyển..."></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a th:href="@{/phieu-nhap}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle me-1"></i> Hủy
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-arrow-right-circle me-1"></i> Tiếp Tục Nhập Chi Tiết Hải Sản
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
